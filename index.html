<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: the page reaches under notches; the canvas itself is fitted inside the safe area
     (see #safe-probe and Display.resize). Zooming is off: pinch / double-tap would wreck touch play. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<title>THE WHITE TRAIL</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/ui/touch.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    position: fixed; inset: 0;
  }
  #safe-probe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game {
    display: block;
    flex: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    color: #cbd5e1; font: 15px/1.5 Georgia, "Times New Roman", serif; text-align: center;
    pointer-events: none;
  }
  #boot.error { color: #fca5a5; pointer-events: auto; }
  #boot code { background: #111827; padding: 2px 6px; color: #f1f5f9; }
  #boot h1 { font-weight: normal; letter-spacing: 0.35em; font-size: 22px; color: #f1f5f9; margin: 0; }
</style>
</head>
<body>
  <div id="safe-probe"></div>
  <canvas id="game" tabindex="0" aria-label="THE WHITE TRAIL game canvas"></canvas>
  <div id="touch" aria-hidden="true"></div>
  <div id="rotate" role="alert" aria-live="polite">
    <div class="rotate-phone"><span></span></div>
    <h2>THE WHITE TRAIL</h2>
    <p>Turn your device sideways to play.</p>
    <p class="rotate-small">The investigation waits where you left it.</p>
  </div>
  <div id="boot"><h1>THE WHITE TRAIL</h1><div id="boot-msg">Loading…</div></div>
  <script>
    // ES modules cannot load from file:// in most browsers. Explain instead of failing silently.
    if (location.protocol === 'file:') {
      var b = document.getElementById('boot');
      b.className = 'error';
      document.getElementById('boot-msg').innerHTML =
        'This game must be served over http to load its modules.<br>' +
        'In this folder run <code>node tools/serve.mjs</code> (or double-click <code>start.bat</code>)<br>' +
        'then open <code>http://localhost:8080</code>.';
    }
    window.addEventListener('error', function (e) {
      var b = document.getElementById('boot');
      if (!b || b.dataset.done) return;
      b.className = 'error';
      document.getElementById('boot-msg').textContent = 'Failed to start: ' + (e.message || e);
    });
    // iOS Safari ignores user-scalable=no: block its pinch gestures and double-tap zoom directly.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function (e) { if (e.target && e.target.closest && e.target.closest('#game, #touch')) e.preventDefault(); });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.target.closest('#game, #touch')) e.preventDefault(); }, { passive: false });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
